[project]
name = "visura-backend"
version = "0.2.0"
description = "VISURA — Image-to-Optimal-Prompt AI (visual reverse engineering) — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "google-genai>=1.20",
    "openai>=1.60",
    "pillow>=11.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: requires real API keys and network; deselected by default (run with RUN_LIVE_TESTS=1)",
]
