[project]
name = "imprompt-backend"
version = "0.3.0"
description = "ImPrompt: image-to-optimal-prompt AI (visual reverse engineering) FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "google-genai>=1.20",
    "openai>=1.60",
    "pillow>=11.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/models/schemas.py" = ["I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: requires real API keys and network; deselected by default (run with RUN_LIVE_TESTS=1)",
]
